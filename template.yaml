AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  InterviewMitra Pro - Voice-based Mock Interview Coach
  P3: Interview Loop, Speech Output (Polly), and Heuristic Feedback Functions.

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: python3.12
    Architectures:
      - x86_64
    Environment:
      Variables:
        AUDIO_BUCKET_NAME: !Ref InterviewAudioBucket
        DEFAULT_VOICE_ID: Joanna
        QUESTION_BANK_PATH: data/question_bank.json

Resources:
  InterviewAudioBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "interviewmitra-audio-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - HEAD
            AllowedOrigins:
              - "*"
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldAudio
            Status: Enabled
            ExpirationInDays: 2

  NextRoundFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/next_round.handler
      Description: Picks the next interview question matching round difficulty and keyword relevance.
      Events:
        NextRoundApi:
          Type: Api
          Properties:
            Path: /interview/next
            Method: post

  GenerateFeedbackFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/generate_feedback.handler
      Description: Evaluates interview transcript for filler words, response length, and computes overall score.
      Events:
        GenerateFeedbackApi:
          Type: Api
          Properties:
            Path: /interview/feedback
            Method: post

  SpeakQuestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/speak_question.handler
      Description: Synthesizes speech with Amazon Polly and returns an S3 presigned URL.
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - polly:SynthesizeSpeech
              Resource: "*"
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource: !Sub "${InterviewAudioBucket.Arn}/*"
      Events:
        SpeakQuestionApi:
          Type: Api
          Properties:
            Path: /interview/speak
            Method: post

Outputs:
  InterviewApi:
    Description: "API Gateway endpoint URL for Prod stage"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  AudioBucketName:
    Description: "S3 Bucket storing synthesized Polly audio files"
    Value: !Ref InterviewAudioBucket
  NextRoundFunctionArn:
    Description: "NextRound Lambda Function ARN"
    Value: !GetAtt NextRoundFunction.Arn
  GenerateFeedbackFunctionArn:
    Description: "GenerateFeedback Lambda Function ARN"
    Value: !GetAtt GenerateFeedbackFunction.Arn
  SpeakQuestionFunctionArn:
    Description: "SpeakQuestion Lambda Function ARN"
    Value: !GetAtt SpeakQuestionFunction.Arn
